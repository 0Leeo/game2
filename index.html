<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peashooter Boss Update</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu-btn">☰</div>

    <!-- NUEVO HUD UNIFICADO DE ZONA Y METROS -->
    <div id="hud-top-right" style="position: fixed; top: 20px; right: 20px; color: white; font-family: Arial; z-index: 10001; pointer-events: none;">
        <div style="background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 15px; border: 2px solid #FFD700; backdrop-filter: blur(5px);">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="zone-indicator" style="font-size: 32px;">🌿</span>
                <div>
                    <div style="font-size: 12px; color: #FFD700; text-transform: uppercase; letter-spacing: 1px;">ZONA ACTUAL</div>
                    <div id="zone-name" style="font-size: 18px; font-weight: bold; color: #81C784;">Pradera Verde</div>
                </div>
            </div>
            <hr style="border-color: #FFD700; margin: 10px 0;">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 12px; color: #aaa;">DISTANCIA</span>
                <span style="font-size: 24px; font-weight: bold; color: white;">
                    <span id="meters-display">0</span><span style="font-size: 14px;">m</span>
                </span>
            </div>
            <!-- Barra de progreso de zona -->
            <div style="margin-top: 10px; background: rgba(255,255,255,0.2); height: 4px; border-radius: 2px; overflow: hidden;">
                <div id="zone-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4CAF50, #FFD700); transition: width 0.3s;"></div>
            </div>
            <div style="font-size: 10px; color: #aaa; margin-top: 5px; text-align: right;">
                Próximo: <span id="next-milestone">2500m</span>
            </div>
        </div>
    </div>

    <!-- Medidor de distancia oculto (para compatibilidad) -->
    <div id="distance-meter" style="display: none;">
        Distancia: <span id="meters">0</span>m
    </div>

    <div id="pause-menu" class="hidden">
        <div class="menu-content" style="max-height: 85vh; overflow-y: auto;">
            <h2>PERFIL</h2>
            <hr>
            <p>Nivel: <span id="menu-lvl">1</span></p>
            <p>EXP: <span id="menu-exp">0</span> / <span id="menu-next-lvl">100</span></p>
            <p>Palomas eliminadas: <span id="kills">0</span></p>
            
            <!-- SECCIÓN DE ZONAS DESCUBIERTAS -->
            <h3 style="color: #FFD700; margin-top: 20px;">🗺️ ZONAS DESCUBIERTAS</h3>
            <hr style="border-color: #FFD700;">
            <div id="zones-container" style="text-align: left; max-height: 300px; overflow-y: auto; padding: 10px;">
                <!-- Las zonas se generarán dinámicamente -->
            </div>
            
            <hr>
            <button id="resume-btn">REANUDAR</button>
            <!-- BOTÓN DE RESETEO PARCIAL -->
    <button id="reset-partial-btn" style="background: #FF6B6B; color: white; padding: 8px 15px; border: none; border-radius: 5px; margin-top: 15px; cursor: pointer; font-size: 12px; width: 100%;">
        🔄 Reiniciar Economía
    </button>
    <p style="font-size: 10px; color: #aaa; margin-top: 5px;">Borra monedas, mejoras y misiones. Mantiene nivel, EXP y kills.</p>
</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="touch-controls">
        <div class="left-group">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
        </div>
        <button id="btn-jump">▲</button>
    </div>

    <script src="game.js"></script>

</body>
</html>
